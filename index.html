<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atrapar Limones</title>
  
  <!-- Importando fuente lúdica para el diseño del juego -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="limones.css"/>
  <script src="utils.js"></script>
</head>
<body onload="iniciar()">
  <div class="contenedor">
    
    <!-- Contenedor para alinear la imagen y el título -->
    <div class="titulo-contenedor">
      <img src="limon.png" alt="Icono de Limón" class="icono-limon">
      <h1>Atrapar Limones</h1>
    </div>
    
    <p>Si del cielo te caen limones ..... ¡Atrápalos!</p>
    <h2>Autor: Isis Montenegro</h2>
    
    <!-- Panel movido arriba del canvas para mejor visibilidad (HUD) -->
    <div class="panel">
      <p>Puntaje: <span id="txtPuntaje">0</span></p>
      <p>Vidas: <span id="txtVidas">3</span></p>
    </div>

    <canvas id="areaJuego" width="600" height="400"></canvas>
    
    <div class="botones">
      <button onclick="moverIzquierda();">Izquierda</button>
      <button onclick="moverDerecha();">Derecha</button>
      <button onclick="reiniciar();" class="btn-rojo">Reiniciar</button>
    </div>
  </div>
  <script src="limones.js"></script>
</body>
</html>
